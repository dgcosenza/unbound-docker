# Hardened production-style compose example for dgcosenza/unbound
#
# Pin production deployments by @sha256 digest. This example runs Unbound on a
# private bridge network with minimal Linux capabilities (dropping ALL and
# retaining only what is needed to bind port 53 and drop to uid 101 `unbound`).
# For strict read_only: true rootfs, mount a writable volume at /var/unbound
# (pre-seeded with root.hints and root.key) or disable auto-trust-anchor-file.

services:
  unbound:
    image: dgcosenza/unbound:latest
    container_name: unbound
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    volumes:
      # Option A: drop-in override files alongside defaults
      - ./custom.conf.d:/etc/unbound/custom.conf.d:ro
      # Option B: mount a complete custom configuration read-only
      # - ./unbound.conf:/etc/unbound/unbound.conf:ro
    healthcheck:
      test: ["CMD", "drill", "-Q", "@127.0.0.1", "nlnetlabs.nl"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M
    networks:
      dns_internal:
        ipv4_address: 172.20.0.10

networks:
  dns_internal:
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
