name: Public content check

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:

permissions: {}

jobs:
  public-check:
    name: Public content check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tracked files, LICENSE, attribution, license badges, and PR text
        env:
          PR_TEXT: ${{ github.event.pull_request.title }} ${{ github.event.pull_request.body }}
        run: .github/scripts/public-check.sh
