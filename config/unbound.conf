# Default configuration for dgcosenza/unbound (Debian 13)
# Compatible with klutchell/unbound drop-in mounts (/etc/unbound/unbound.conf
# and /etc/unbound/custom.conf.d/*.conf).

server:
    do-daemonize: no
    username: "unbound"
    chroot: ""
    directory: "/etc/unbound"
    logfile: ""
    pidfile: ""
    verbosity: 1

    interface: 0.0.0.0
    do-ip4: yes
    do-udp: yes
    do-tcp: yes
    prefer-ip6: no

    # DNSSEC and protocol hardening
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-algo-downgrade: yes
    harden-below-nxdomain: yes
    harden-short-bufsize: yes
    harden-large-queries: yes
    use-caps-for-id: no
    qname-minimisation: yes
    aggressive-nsec: yes
    edns-buffer-size: 1232
    hide-identity: yes
    hide-version: yes
    identity: "DNS"

    # Cache and latency defaults sized safely for container memory limits
    num-threads: 1
    so-sndbuf: 0
    msg-cache-size: 48m
    rrset-cache-size: 96m
    prefetch: yes
    prefetch-key: yes
    serve-expired: yes
    serve-expired-ttl: 86400
    serve-expired-client-timeout: 1800
    outgoing-range: 8192
    num-queries-per-thread: 4096

    # Allow loopback and Docker bridge networks by default.
    # Add LAN subnets via /etc/unbound/custom.conf.d/*.conf or a mounted unbound.conf.
    access-control: 127.0.0.0/8 allow
    access-control: 172.16.0.0/12 allow
    access-control: ::1/128 allow
    access-control: fd00::/8 allow

    # DNS rebinding protection for non-public address ranges
    private-address: 172.16.0.0/12
    private-address: 169.254.0.0/16
    private-address: fd00::/8
    private-address: fe80::/10
    private-address: ::ffff:0:0/96

    # Root hints and RFC 5011 DNSSEC root trust anchor
    root-hints: /var/unbound/root.hints
    auto-trust-anchor-file: /var/unbound/root.key

    # System CA bundle for DNS-over-TLS forwarding and auth-zone transfers
    tls-cert-bundle: /etc/ssl/certs/ca-certificates.crt

remote-control:
    control-enable: no

include-toplevel: /etc/unbound/custom.conf.d/*.conf
